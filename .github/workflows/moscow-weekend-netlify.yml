name: Deploy Moscow Asia Weekend to Netlify

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/moscow-weekend-netlify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build static zip
        run: |
          cd moscow-asia-weekend
          zip -r ../site.zip .
